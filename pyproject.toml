[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "env-audit-cli"
version = "0.1.0"
description = "Check dotenv files against a template without logging values"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["dotenv", "configuration", "cli", "ci"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
env-audit = "env_audit:main"

[tool.setuptools]
py-modules = ["env_audit"]
